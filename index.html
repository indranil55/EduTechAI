<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComputeEase AI - Interactive Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ComputeEase AI</h1>
        <button id="apiKeyBtn" class="btn-secondary">Configure API Key</button>
    </header>

    <div id="apiModal" class="modal">
        <div class="modal-content">
            <h2>Gemini API Key</h2>
            <input type="password" id="apiKeyInput" placeholder="Enter API Key">
            <button id="saveKeyBtn" class="btn-primary">Save</button>
            <button id="closeModalBtn" class="btn-secondary">Cancel</button>
        </div>
    </div>

    <main class="container">
        <aside class="sidebar">
            <h2>Modules</h2>
            <ul id="topicList">
                <li data-topic="Introduction to computer, Input, Process, Output">1. Introduction to Computer</li>
                <li data-topic="Computer Hardware components monitor CPU keyboard mouse">2. Hardware Basics</li>
                <li data-topic="Operating System desktop icons start menu">3. Operating System</li>
            </ul>
        </aside>

        <section class="tutor-area">
            <div class="tutor-header">
                <h2 id="currentTopicTitle">Welcome</h2>
                <div class="voice-controls">
                    <select id="langSelect">
                        <option value="bn-IN">Bengali (বাংলা)</option>
                        <option value="en-US">English (US)</option>
                        <option value="hi-IN">Hindi (हिंदी)</option>
                    </select>
                    <button id="speakBtn" class="btn-voice" disabled>Listen</button>
                    <button id="stopSpeakBtn" class="btn-voice hidden">Stop</button>
                </div>
            </div>

            <div id="aiOutput" class="output-box">
                <p>Select a module to start.</p>
            </div>
            
            <!-- মিডিয়া দেখানোর জায়গা -->
            <div id="mediaContainer" class="media-box hidden"></div>

            <div class="ask-box">
                <input type="text" id="customQuestion" placeholder="Ask a question...">
                <button id="askBtn" class="btn-primary">Ask AI</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
